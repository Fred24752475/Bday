<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Happy Birthday Jessica</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Great+Vibes&family=Outfit:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=9" />
  </head>
  <body>
    <svg class="heart-svg" viewBox="0 0 600 552" aria-hidden="true">
      <path
        id="heart-path"
        d="M300,516.406C236.719,467.578,47.266,342.187,47.266,197.266
        C47.266,116.016,113.672,49.609,194.922,49.609
        C241.406,49.609,282.422,71.484,300,105.469
        C317.578,71.484,358.594,49.609,405.078,49.609
        C486.328,49.609,552.734,116.016,552.734,197.266
        C552.734,342.187,363.281,467.578,300,516.406Z"
      />
    </svg>

    <div class="bg-photo" aria-hidden="true">
      <img
        src="photos/jessica.png"
        alt=""
        width="774"
        height="1024"
        id="bg-photo-img"
      />
    </div>
    <div id="canvas-wrap"></div>
    <div class="vignette"></div>
    <div class="glow"></div>

    <div class="stage">
      <p class="eyebrow" id="eyebrow">Happy Birthday</p>
      <h1 class="name" id="her-name">Jessica</h1>
    </div>

    <article class="wish" id="wish">
      <p class="wish-open" id="wish-open"></p>
      <div class="wish-lines" id="wish-lines"></div>
      <p class="wish-close" id="wish-close"></p>
    </article>

    <div class="memories" id="memories" aria-hidden="true"></div>

    <button class="replay" id="replay" type="button" aria-label="Play again">
      Play again
    </button>
    <button class="voice-toggle" id="voice-toggle" type="button" aria-pressed="true">
      Sound on
    </button>

    <div class="intro" id="intro" tabindex="0" role="button" aria-label="Tap to open Jessica's birthday gift">
      <div class="intro-copy" id="intro-copy">
        <p class="intro-kicker">for Jessica</p>
        <p class="intro-title">I made this for you</p>
        <span class="intro-hit">tap anywhere · sound on</span>
      </div>
      <div class="countdown" id="countdown" aria-hidden="true">
        <div class="countdown-ring"></div>
        <p class="countdown-label">ready?</p>
        <span class="countdown-num" id="countdown-num">3</span>
      </div>
    </div>

    <script>
      window.BDAY = {
        started: false,
        opened: false,
        voiceOn: true,
        readyFns: [],
        whenReady: function (fn) {
          if (window.BDAY.opened) {
            fn();
          } else {
            window.BDAY.readyFns.push(fn);
          }
        },
        unlockVoice: function () {
          if (!("speechSynthesis" in window)) {
            return;
          }
          try {
            window.speechSynthesis.resume();
          } catch (error) {}
        },
      };

      (function () {
        var intro = document.getElementById("intro");
        var introCopy = document.getElementById("intro-copy");
        var countdown = document.getElementById("countdown");
        var numEl = document.getElementById("countdown-num");
        var labelEl = document.querySelector(".countdown-label");
        var ring = document.querySelector(".countdown-ring");
        var labels = { 3: "ready?", 2: "almost", 1: "for you", 0: "open your heart" };
        var spoken = { 3: "3", 2: "2", 1: "1", 0: "open your heart" };
        var steps = [3, 2, 1, 0];
        var canSpeak = "speechSynthesis" in window;
        var stepIndex = 0;

        function makeVoice(text, rate) {
          var u = new SpeechSynthesisUtterance(String(text));
          u.rate = rate;
          u.pitch = 1;
          u.volume = 1;
          u.lang = "en-US";
          return u;
        }

        function showNumber(n) {
          numEl.textContent = String(n);
          labelEl.textContent = labels[n];
          numEl.classList.remove("is-pop");
          void numEl.offsetWidth;
          numEl.classList.add("is-pop");
        }

        function finish() {
          window.BDAY.opened = true;
          intro.style.transition = "opacity 1.2s ease";
          intro.style.opacity = "0";
          intro.style.pointerEvents = "none";
          window.BDAY.readyFns.forEach(function (fn) {
            try {
              fn();
            } catch (error) {}
          });
          beginWish();
        }

        function beginWish() {
          if (typeof window.BDAY.startNarration === "function") {
            window.BDAY.startNarration();
            return;
          }
          keepAlive(beginWish);
        }

        function keepAlive(next) {
          if (!canSpeak || window.BDAY.voiceOn === false) {
            window.setTimeout(next, 400);
            return;
          }
          var keep = makeVoice(".", 0.6);
          keep.volume = 0.01;
          keep.onend = next;
          keep.onerror = function () {
            window.setTimeout(next, 300);
          };
          try {
            window.speechSynthesis.speak(keep);
          } catch (error) {
            window.setTimeout(next, 300);
          }
        }

        function afterVoice(u, linger, fallback, next) {
          var done = false;
          function go() {
            if (done) {
              return;
            }
            done = true;
            window.setTimeout(next, linger);
          }
          u.onend = go;
          u.onerror = go;
          window.setTimeout(go, fallback);
        }

        function playStep() {
          var n = steps[stepIndex];
          showNumber(n);

          var next = function () {
            stepIndex += 1;
            if (stepIndex >= steps.length) {
              window.setTimeout(finish, 900);
              return;
            }
            playStep();
          };

          if (!canSpeak || window.BDAY.voiceOn === false) {
            window.setTimeout(next, n === 0 ? 2400 : 2200);
            return;
          }

          var u = makeVoice(spoken[n], n === 0 ? 0.62 : 0.58);
          afterVoice(u, n === 0 ? 900 : 1600, n === 0 ? 4200 : 2800, next);
          try {
            window.speechSynthesis.resume();
            window.speechSynthesis.speak(u);
          } catch (error) {
            window.setTimeout(next, 2200);
          }
        }

        function start(event) {
          if (event && event.target && event.target.closest && event.target.closest(".voice-toggle")) {
            return;
          }
          if (window.BDAY.started) {
            return;
          }
          window.BDAY.started = true;

          introCopy.style.transition = "opacity 0.6s ease";
          introCopy.style.opacity = "0";
          countdown.classList.add("is-on");
          countdown.style.visibility = "visible";
          countdown.style.opacity = "1";
          if (ring) {
            ring.style.opacity = "1";
          }

          if (canSpeak) {
            try {
              window.speechSynthesis.resume();
            } catch (error) {}
          }

          playStep();
        }

        intro.addEventListener("click", start);
      })();
    </script>
    <script src="https://unpkg.com/three@0.160.1/build/three.min.js"></script>
    <script src="https://unpkg.com/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="app.js?v=9"></script>
  </body>
</html>
